services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: noctivus-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      PORT: "4000"
      ENVIRONMENT: production
      PYTHONUNBUFFERED: "1"
      SQLITE_DB_PATH: /data/noctivus.db
    volumes:
      - backend_data:/data
    networks:
      - noctivus
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.75"
        reservations:
          memory: 256M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: noctivus-frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - noctivus
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.50"
        reservations:
          memory: 64M
          cpus: "0.10"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend_data:
    name: noctivus_data

networks:
  noctivus:
    driver: bridge
